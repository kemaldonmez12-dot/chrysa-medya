<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chrysa Reel Takvimi</title>
<style>
@font-face{font-family:"Cormorant";src:url("fonts/Cormorant-Regular.ttf");font-weight:400;font-display:swap}
@font-face{font-family:"Cormorant";src:url("fonts/Cormorant-SemiBold.ttf");font-weight:600;font-display:swap}
@font-face{font-family:"Nata Sans";src:url("fonts/NataSans-Regular.ttf");font-weight:400;font-display:swap}
@font-face{font-family:"Nata Sans";src:url("fonts/NataSans-SemiBold.ttf");font-weight:600;font-display:swap}
:root{
  --zemin:#F8F5EF; --kart:#FFFFFF; --bej:#F1EBE1; --yazi:#2A2622; --soluk:#7A6E64; --kahve:#71543A; --altin:#C6A664;
  --cizgi:#E6DED2; --yesil:#3F7A52; --yesil-z:#E3F0E6; --kirmizi:#A33A2E; --kirmizi-z:#F7E1DD; --sari:#8A6A1F; --sari-z:#F5EBCF;
  --golge:0 1px 2px rgba(42,38,34,.06),0 6px 18px rgba(42,38,34,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --zemin:#1C1916; --kart:#26221E; --bej:#2E2925; --yazi:#F1EBE1; --soluk:#A89C90; --kahve:#E3CC93; --altin:#C6A664;
  --cizgi:#3A342E; --yesil:#8FC9A0; --yesil-z:#22362A; --kirmizi:#F0A398; --kirmizi-z:#3D2420; --sari:#E8C877; --sari-z:#3A3120;
  --golge:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--zemin);color:var(--yazi);font:400 15px/1.45 "Nata Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.sayfa{max-width:640px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 48px}
header{padding:8px 0 14px}
.marka{font:600 13px "Nata Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--altin)}
h1{font:400 34px/1.1 "Cormorant",Georgia,serif;margin:4px 0 6px;color:var(--kahve)}
.guncel{font-size:12.5px;color:var(--soluk)}
.sayilar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.sayi{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:10px 12px;box-shadow:var(--golge)}
.sayi b{display:block;font:600 24px/1.1 "Cormorant",Georgia,serif;color:var(--kahve)}
.sayi span{font-size:12px;color:var(--soluk)}
.siradaki{margin:18px 0 6px;background:var(--kahve);color:#F8F5EF;border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .siradaki{background:#3A2F25}}
.siradaki .ust{font:600 11.5px "Nata Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--altin)}
.siradaki .urun{font:400 23px/1.15 "Cormorant",Georgia,serif;margin:4px 0 6px}
.siradaki .ne{font-size:13px;opacity:.85}
.siradaki .geri{font:600 13px "Nata Sans";margin-top:8px;color:#F1DFB0}
.siradaki video{width:86px;height:153px;object-fit:cover;border-radius:10px;background:#000}
.filtre{display:flex;gap:6px;margin:18px 0 6px;overflow-x:auto;padding-bottom:2px}
.filtre button{flex:none;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);border-radius:999px;padding:8px 14px;font:600 13px "Nata Sans";min-height:36px}
.filtre button[aria-pressed="true"]{background:var(--kahve);color:var(--zemin);border-color:var(--kahve)}
.gun{margin:20px 0 8px;font:600 12.5px "Nata Sans";letter-spacing:.08em;text-transform:uppercase;color:var(--soluk)}
.gun.bugun{color:var(--kahve)}
.kayit{background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;margin-bottom:8px;box-shadow:var(--golge);overflow:hidden}
.kayit summary{list-style:none;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;min-height:56px}
.kayit summary::-webkit-details-marker{display:none}
.saat{font:600 15px "Nata Sans";font-variant-numeric:tabular-nums}
.baslik{min-width:0}
.baslik .u{font:400 18px/1.2 "Cormorant",Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.baslik .t{font-size:12px;color:var(--soluk);margin-top:1px}
.rozet{font:600 11.5px "Nata Sans";padding:4px 9px;border-radius:999px;white-space:nowrap}
.r-yayinlandi{background:var(--yesil-z);color:var(--yesil)}
.r-onayli{background:var(--bej);color:var(--kahve)}
.r-gecikti{background:var(--sari-z);color:var(--sari)}
.r-hata{background:var(--kirmizi-z);color:var(--kirmizi)}
.r-taslak{background:var(--bej);color:var(--soluk)}
.detay{padding:0 14px 14px;display:grid;grid-template-columns:96px 1fr;gap:14px}
.detay video{width:96px;height:171px;object-fit:cover;border-radius:10px;background:#000}
.caption{white-space:pre-wrap;font-size:13.5px;line-height:1.5;margin:0}
.baglanti{display:inline-block;margin-top:10px;font:600 13px "Nata Sans";color:var(--kahve)}
.hata-not{margin-top:8px;font-size:12.5px;color:var(--kirmizi)}
.bos,.yukleniyor{color:var(--soluk);text-align:center;padding:40px 0}
footer{margin-top:28px;font-size:12px;color:var(--soluk);text-align:center}
@media (max-width:380px){.detay{grid-template-columns:1fr}.detay video{width:100%;height:auto;aspect-ratio:9/16;max-height:360px}}
</style>
</head>
<body>
<div class="sayfa">
  <header>
    <div class="marka">Chrysa by RK · @chrysabyrk</div>
    <h1>Reel takvimi</h1>
    <div class="guncel" id="guncel">Yükleniyor…</div>
    <div class="sayilar" id="sayilar"></div>
  </header>
  <section id="siradaki"></section>
  <nav class="filtre" id="filtre" aria-label="Duruma göre süz">
    <button data-f="hepsi" aria-pressed="true">Tümü</button>
    <button data-f="planli" aria-pressed="false">Planlı</button>
    <button data-f="yayinlandi" aria-pressed="false">Yayınlandı</button>
    <button data-f="sorun" aria-pressed="false">Sorunlu</button>
  </nav>
  <main id="liste"><div class="yukleniyor">Takvim yükleniyor…</div></main>
  <footer>Saatler Türkiye saatidir. Paylaşım GitHub'da birkaç dakika gecikebilir. Sayfa her açılışta güncellenir.</footer>
</div>
<script>
const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const TR = { timeZone: "Europe/Istanbul" };
let veri = [], filtre = "hepsi";
try { filtre = localStorage.getItem("chrysa-filtre") || "hepsi"; } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parca = t => Object.fromEntries(new Intl.DateTimeFormat("tr-TR", { ...TR, year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", weekday: "short", hour12: false })
  .formatToParts(t).map(p => [p.type, p.value]));
const gunAnahtari = t => new Intl.DateTimeFormat("en-CA", { ...TR, year: "numeric", month: "2-digit", day: "2-digit" }).format(t);
const gunEtiketi = t => { const d = new Date(new Date(t).toLocaleString("en-US", TR)); return `${GUN[d.getDay()]} ${d.getDate()} ${AY[d.getMonth()]}`; };
const saat = t => { const p = parca(t); return `${p.hour}:${p.minute}`; };

function durum(k) {
  if (k.durum === "yayinlandi") return ["yayinlandi", "Yayınlandı ✓"];
  if (k.durum === "hata") return ["hata", "Hata"];
  if (k.durum === "onayli") return new Date(k.zaman) < Date.now() - 45 * 60e3 ? ["gecikti", "Gecikti"] : ["onayli", "Planlı"];
  return ["taslak", k.durum === "medya_bekliyor" ? "Video bekliyor" : "Onay bekliyor"];
}

function geriSayim(t) {
  const fark = new Date(t) - Date.now();
  if (fark <= 0) return "Şimdi paylaşılıyor olmalı";
  const g = Math.floor(fark / 864e5), s = Math.floor(fark / 36e5) % 24, d = Math.floor(fark / 6e4) % 60;
  return (g ? `${g} gün ` : "") + (s ? `${s} sa ` : "") + `${d} dk sonra`;
}

function ciz() {
  const say = { yayinlandi: 0, planli: 0, sorun: 0 };
  veri.forEach(k => { const [d] = durum(k); if (d === "yayinlandi") say.yayinlandi++; else if (d === "hata" || d === "gecikti") say.sorun++; else say.planli++; });
  document.getElementById("sayilar").innerHTML =
    `<div class="sayi"><b>${say.yayinlandi}</b><span>yayınlandı</span></div>` +
    `<div class="sayi"><b>${say.planli}</b><span>planlı</span></div>` +
    `<div class="sayi"><b>${say.sorun}</b><span>sorunlu</span></div>`;

  const sira = veri.find(k => k.durum === "onayli" && new Date(k.zaman) > Date.now() - 45 * 60e3);
  document.getElementById("siradaki").innerHTML = sira ? `
    <div class="siradaki"><div>
      <div class="ust">Sıradaki paylaşım</div>
      <div class="urun">${esc(sira.urun)}</div>
      <div class="ne">${esc(gunEtiketi(sira.zaman))} · ${saat(sira.zaman)} · ${esc(sira.tip)}</div>
      <div class="geri">${geriSayim(sira.zaman)}</div>
    </div>${sira.video ? `<video src="${esc(sira.video)}#t=0.5" muted playsinline preload="metadata" controls></video>` : ""}</div>` : "";

  const uygun = veri.filter(k => {
    const [d] = durum(k);
    return filtre === "hepsi" || (filtre === "yayinlandi" && d === "yayinlandi") ||
      (filtre === "sorun" && (d === "hata" || d === "gecikti")) || (filtre === "planli" && (d === "onayli" || d === "taslak"));
  });
  if (!uygun.length) { document.getElementById("liste").innerHTML = `<div class="bos">Bu süzgeçte kayıt yok.</div>`; return; }
  const bugun = gunAnahtari(new Date());
  let html = "", onceki = "";
  uygun.forEach(k => {
    const g = gunAnahtari(new Date(k.zaman));
    if (g !== onceki) { html += `<div class="gun${g === bugun ? " bugun" : ""}">${g === bugun ? "Bugün · " : ""}${esc(gunEtiketi(k.zaman))}</div>`; onceki = g; }
    const [d, etiket] = durum(k);
    html += `<details class="kayit"><summary>
        <div class="saat">${saat(k.zaman)}</div>
        <div class="baslik"><div class="u">${esc(k.urun)}</div><div class="t">${esc(k.tip)} · ${esc(k.id)}</div></div>
        <span class="rozet r-${d}">${etiket}</span>
      </summary><div class="detay">
        ${k.video ? `<video src="${esc(k.video)}#t=0.5" muted playsinline preload="none" controls></video>` : "<div></div>"}
        <div><p class="caption">${esc(k.caption)}</p>
          ${k.permalink ? `<a class="baglanti" href="${esc(k.permalink)}" target="_blank" rel="noopener">Instagram'da aç →</a>` : ""}
          ${k.hata ? `<div class="hata-not">${esc(k.hata)}</div>` : ""}
          ${d === "gecikti" ? `<div class="hata-not">Saati geçti ama henüz yayınlanmadı; sonraki kontrolde denenir.</div>` : ""}
        </div></div></details>`;
  });
  document.getElementById("liste").innerHTML = html;
}

document.getElementById("filtre").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filtre = b.dataset.f;
  try { localStorage.setItem("chrysa-filtre", filtre); } catch (er) {}
  document.querySelectorAll("#filtre button").forEach(x => x.setAttribute("aria-pressed", x === b));
  ciz();
});
document.querySelectorAll("#filtre button").forEach(x => x.setAttribute("aria-pressed", x.dataset.f === filtre));

fetch("takvim.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(j => {
  veri = j.kayitlar || [];
  const g = new Date(j.guncelleme);
  document.getElementById("guncel").textContent = `Son güncelleme: ${gunEtiketi(g)} ${saat(g)} · ${veri.length} reel`;
  ciz();
  setInterval(ciz, 60e3);
}).catch(() => {
  document.getElementById("guncel").textContent = "Takvim verisi okunamadı.";
  document.getElementById("liste").innerHTML = `<div class="bos">Takvim şu an yüklenemedi. Biraz sonra sayfayı yenileyin.</div>`;
});
</script>
</body>
</html>
